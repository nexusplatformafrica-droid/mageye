kind = "web"
previewPath = "/"
title = "Mageye"
description = "A cinematic portfolio for Hassan Mageye, a Ugandan-American writer, director and producer creating African stories and character-driven drama."
version = "1.0.0"
id = "artifacts/video-director-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23861

[services.development]
run = "pnpm --filter @workspace/video-director-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-director-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/video-director-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23861"
BASE_PATH = "/"
