kind = "web"
previewPath = "/"
title = "Video Director Portfolio"
description = "A cinematic portfolio for an independent video director, presenting selected films, visual approach, services, and contact details in a refined editorial experience."
version = "1.0.0"
id = "artifacts/video-director-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23861

[services.development]
run = "pnpm --filter @workspace/video-director-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-director-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/video-director-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23861"
BASE_PATH = "/"
